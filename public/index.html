<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!--
      Política de Referer de la SPA, fijada acá y no en el servidor (24/9/2026).
      El nginx de los clientes del VPS manda "Referrer-Policy: same-origin", y con eso un <img>,
      un <audio> o un window.open hacia api-<cliente> sale SIN Referer ni Origin. Sanctum (modo
      stateful, por cookie) sólo levanta la sesión si uno de esos dos headers viene de un dominio
      conocido: sin ellos la ruta autenticada contesta 401 y la foto del chat del asistente, el audio
      de WhatsApp o la descarga de un adjunto no cargan ("No se pudo cargar la imagen").
      El meta pisa el header del documento. strict-origin-when-cross-origin es el default de los
      navegadores: a un dominio ajeno sólo le llega el origen, nunca la ruta. No sacarlo aunque el
      servidor "ya lo configure": cada hosting manda otra cosa.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="preload" rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>

    <!-- Configuración por frente (URL de la API, URL del SPA, Pusher...): define window.__CC_CONFIG__.
         En producción la escribe el admin en cada deploy; en desarrollo se copia de config.js.example
         (o no existe y la app cae al .env). Va síncrono y ANTES que cualquier otro script porque los
         stores leen la URL de la API al importarse. Ver src/runtime_config.js. -->
    <script src="<%= BASE_URL %>config.js"></script>

    <!-- Arranque: consulta anticipada de la dirección activa de este sistema (misión
         redireccion-version-antes-del-login, 24/9/2026). Va acá, inline, y no en el bundle: el
         bundle se baja, se parsea y se evalúa antes de poder hacer nada, y la idea es que la
         respuesta ya esté en la red (o resuelta) para cuando Vue arranca. Tiene que ser ES5 y todo
         adentro de try/catch: corre en cada carga de cada cliente y si tira una excepción no puede
         dejar la aplicación sin arrancar. -->
    <script>
    /*
     * Qué hace:
     *
     * Publica window.__CC_ARRANQUE__ = { version_activa }, y dispara, sin esperar a nadie, la
     * consulta "¿cuál es la dirección activa de este sistema?" cuya promesa queda en
     * window.__CC_ARRANQUE__.version_activa. La usa el login (src/mixins/check_version.js, método
     * iniciar_consulta_de_version_activa) para mandar al negocio al frente correcto antes de que
     * escriba su clave. Ver el comentario donde se dispara.
     *
     * Si el navegador no tiene Promise, o no hay URL de API en window.__CC_CONFIG__ (desarrollo sin
     * config.js), o la consulta falla, version_activa queda en null y el mixin hace la consulta por
     * su cuenta. El nombre __CC_ARRANQUE__ se conserva porque lo lee ese mixin.
     *
     * Solo comentarios de bloque en este archivo: el minificador de HTML puede colapsar los saltos
     * de línea y un comentario de una línea se comería el resto del script.
     */
    (function () {
      var TECHO_CONSULTA_MS = 5000;

      if (typeof Promise === 'undefined') {
        return;
      }

      var arranque = {
        version_activa: null
      };

      window.__CC_ARRANQUE__ = arranque;

      /*
       * Consulta anticipada: "¿cuál es la dirección activa de este sistema?", sin sesión. Solo le
       * sirve a quien NO tiene sesión (App.vue la usa después de auth/me, y solo si dio 401) para
       * mandarlo al frente correcto ANTES del login. Sale acá, apenas carga el documento, por dos
       * motivos: se superpone con la descarga del bundle, y para cuando Vue arranca ya está
       * resuelta, así que un arranque largo de la aplicación (un celular lento) no puede hacer
       * vencer su techo con la respuesta ya en la red: si la consulta saliera recién desde Vue,
       * el temporizador de su techo competiría con ese arranque por el mismo hilo. Es una promesa
       * que NUNCA rechaza: cualquier cosa que no sea un 200 con un objeto JSON es null ("no sé").
       * Misma lógica y mismo techo que consultar_version_activa() de src/utils/version_de_direccion.js,
       * que se usa cuando este script no pudo (desarrollo sin config.js).
       */
      try {
        var api_de_este_frente = window.__CC_CONFIG__ && window.__CC_CONFIG__.VUE_APP_API_URL;

        if (api_de_este_frente && typeof window.fetch === 'function') {
          arranque.version_activa = new Promise(function (resolve) {
            var controlador = typeof window.AbortController === 'function' ? new window.AbortController() : null;
            var temporizador = window.setTimeout(function () {
              if (controlador) { controlador.abort(); }
              resolve(null);
            }, TECHO_CONSULTA_MS);
            var opciones = { method: 'GET', credentials: 'omit', cache: 'no-store', headers: { Accept: 'application/json' } };

            if (controlador) { opciones.signal = controlador.signal; }

            window.fetch(String(api_de_este_frente).replace(/\/+$/, '') + '/api/version-activa', opciones)
              .then(function (res) { return res && res.ok ? res.json() : null; })
              .then(function (json) {
                window.clearTimeout(temporizador);
                resolve(json && typeof json === 'object' && !Array.isArray(json) ? json : null);
              })
              .catch(function () {
                window.clearTimeout(temporizador);
                resolve(null);
              });
          });
        }
      } catch (e) {
        arranque.version_activa = null;
      }
    })();
    </script>

    <!-- Inter: tipografía global de la aplicación -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/qz-tray@2.2.6/qz-tray.js"></script>
